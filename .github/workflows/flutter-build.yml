name: Build JSAW Remote Support (Windows x86_64)

on:
  workflow_dispatch:
    inputs:
      upload-artifact:
        type: boolean
        default: true

env:
  RENDEZVOUS_SERVER: "nrs.jindalsaw.com"
  RS_PUB_KEY: "2m83nfT5gUJel2M5O5mkaeQbnneq2bVkYhxovX5JZYg="
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  UPLOAD_ARTIFACT: "true"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x86_64:
    name: Build JSAW Standalone Windows x86_64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      # --- AUTOMATIC SUBMODULE PATCH: INJECT JSAW SERVER & KEY ---
      - name: Hardcode JSAW Server and Key into Core Config
        shell: bash
        run: |
          python3 -c '
          import os, re

          targets = [
              "libs/hbb_common/src/config.rs",
              "src/common.rs",
              "libs/base/src/config/mod.rs"
          ]

          patched = False
          for path in targets:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()

                  orig = content
                  # Replace Rendezvous Servers
                  content = re.sub(
                      r"pub const RENDEZVOUS_SERVERS:.*?\];",
                      "pub const RENDEZVOUS_SERVERS: &\x27static [&\x27static str] = &[\"nrs.jindalsaw.com\"];",
                      content,
                      flags=re.DOTALL
                  )
                  # Replace Public Key
                  content = re.sub(
                      r"pub const RS_PUB_KEY:.*?;",
                      "pub const RS_PUB_KEY: &\x27static str = \"2m83nfT5gUJel2M5O5mkaeQbnneq2bVkYhxovX5JZYg=\";",
                      content,
                      flags=re.DOTALL
                  )

                  if content != orig:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"SUCCESS: Injected nrs.jindalsaw.com and key into {path}")
                      patched = True

          if not patched:
              print("NOTE: Submodule config handled via custom.txt and Flutter server_model.dart")
          '

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build rustdesk binary
        env:
          RENDEZVOUS_SERVER: "nrs.jindalsaw.com"
          RS_PUB_KEY: "2m83nfT5gUJel2M5O5mkaeQbnneq2bVkYhxovX5JZYg="
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          
          # Inject custom.txt directly inside the portable payload directory
          Set-Content -Path .\rustdesk\custom.txt -Value "host=nrs.jindalsaw.com,key=2m83nfT5gUJel2M5O5mkaeQbnneq2bVkYhxovX5JZYg=" -NoNewline

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Pack Single Standalone JSAW-Remote-Support.exe
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/JSAW-Remote-Support.exe

      - name: Upload Clean Standalone EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: JSAW-Remote-Support-Windows-x86_64
          path: ./SignOutput/JSAW-Remote-Support.exe
